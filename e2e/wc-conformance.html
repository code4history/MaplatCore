<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 設定ファイル（apps/<id>.json）・地図の設定・タイルはページ起点の相対パスで読まれるので、
       基点を MaplatCore の公開ルート（public/ が載る / ）にそろえる（demo/element.html と同じ） -->
  <base href="../">
  <title>maplat-app 適合テスト</title>
  <style>
    body { margin: 0; font: 13px/1.5 system-ui, sans-serif; color: #1a2744; background: #fff; }
    header { padding: 8px 16px; border-bottom: 1px solid #d5d9e2; }
    h1 { font-size: 16px; margin: 0; }
    main { display: grid; grid-template-columns: 500px minmax(0, 1fr); gap: 12px; padding: 12px 16px; }
    #stage .maplat-conformance-container { border: 1px solid #d5d9e2; }
    ol { margin: 0; padding-left: 20px; font: 12px/1.5 ui-monospace, monospace; }
    li.ok::marker { color: #1a7f37; }
    li.ng { color: #b42318; }
    .group { color: #5b6478; }
  </style>
</head>
<body>
  <header>
    <h1>&lt;maplat-app&gt; 層 A の適合テスト（<span id="impl">-</span>）</h1>
    <div id="summary" data-testid="summary">実行中…</div>
  </header>
  <main>
    <div id="stage"></div>
    <ol id="results"></ol>
  </main>
  <script type="module" src="/e2e/wc-conformance-page.ts"></script>
</body>
</html>
