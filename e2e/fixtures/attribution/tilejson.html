<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出典の表示（提供元の TileJSON）</title>
  <style>
    html, body { margin: 0; height: 100%; }
    #map { position: relative; width: 100%; height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script type="module">
    // 提供元の TileJSON の attribution（第三者のサーバーが決める値）が、出典の表示（src/attribution.ts）で
    // 狭い許可表で洗われ、2 行の箱に収まることを確かめるページ（e2e/attribution.spec.ts）。
    // Core は TileJSON の source を作らないので、OpenLayers の地図と TileJSON の source をここで作り、
    // Core と同じく描画（postrender）のたびに refreshDynamic へ渡す。TileJSON は e2e が偽の応答で返す。
    import Map from "ol/Map";
    import View from "ol/View";
    import TileLayer from "ol/layer/Tile";
    import TileJSON from "ol/source/TileJSON";
    import { AttributionDisplay } from "/src/attribution.ts";

    const container = document.getElementById("map");
    const source = new TileJSON({ url: "https://example.org/tilejson.json", crossOrigin: "anonymous" });
    const map = new Map({
      target: container,
      controls: [],
      layers: [new TileLayer({ source })],
      view: new View({ center: [0, 0], zoom: 2 })
    });
    const display = new AttributionDisplay(container, () => "en");
    display.update([source]);
    map.on("postrender", evt => display.refreshDynamic([source], evt.frameState));
    window.__ATTRIBUTION__ = display;
    document.body.dataset.ready = "true";
  </script>
</body>
</html>
